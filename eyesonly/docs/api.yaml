              - group
        required: true
components:
  schemas:
    UserGroup:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        encrypted_name:
          type: string
        crypto_version:
          type: integer
          maximum: 9223372036854775807
          format: int64
          minimum: 0
        encryption_algorithm:
          type: string
          maxLength: 32
        name_nonce:
          type: string
          readOnly: true
        user_role:
          type: string
          readOnly: true
      required:
      - encrypted_name
    GetDeviceSelfStatus:
      type: object
      properties:
        device_identifier:
          type: string
          readOnly: true
          maxLength: 255
        is_registered:
          type: boolean
          readOnly: true
        group_names:
          type: array
          items:
            type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
    DeviceEncryptedImageListResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              group:
                type: string
                format: uuid
                readOnly: true
              encrypted_name:
                type: string
                readOnly: true
              days:
                type: array
                items:
                  type: object
                  properties:
                    day:
                      type: string
                      format: date
                      readOnly: true
                    images:
                      type: array
                      items:
                        type: object
                        properties:
                          image_uuid:
                            type: string
                            format: uuid
                            readOnly: true
                          encrypted_caption:
                            type: string
                            readOnly: true
                            nullable: true
                          crypto_version:
                            type: integer
                            readOnly: true
                          encryption_algorithm:
                            type: string
                            readOnly: true
                          payload_nonce:
                            type: string
                            readOnly: true
                          ciphertext_hash_sha256:
                            type: string
                            readOnly: true
                          key_wrap_algorithm:
                            type: string
                            readOnly: true
                          recipient_key_fingerprint:
                            type: string
                            readOnly: true
                          encrypted_content_key:
                            type: string
                            readOnly: true
                          created_at:
                            type: string
                            format: date-time
                            readOnly: true
                          expires_at:
                            type: string
                            format: date-time
                            readOnly: true
                            nullable: true
                      readOnly: true
                readOnly: true
          readOnly: true
        next_cursor:
          type: string
          readOnly: true
          nullable: true
    MainManagerGroup:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        encrypted_name:
          type: string
        crypto_version:
          type: integer
          maximum: 9223372036854775807
          format: int64
          minimum: 0
        encryption_algorithm:
          type: string
          maxLength: 32
        name_nonce:
          type: string
          readOnly: true
        user_role:
          type: string
          readOnly: true
      required:
      - encrypted_name
    RegisterFCMDevice:
      type: object
      properties:
        registration_id:
          type: string
        type:
          enum:
          - android
          - ios
          - web
          type: string
      required:
      - registration_id
      - type
    DeviceAuthChallengeRequest:
      type: object
      properties:
        device_identifier:
          type: string
          maxLength: 255
      required:
      - device_identifier
    DeviceAuthChallengeResponse:
      type: object
      properties:
        encrypted_challenge:
          type: object
          properties:
            algorithm:
              type: string
              readOnly: true
              maxLength: 64
            ephemeral_public_key:
              type: string
              readOnly: true
            nonce:
              type: string
              readOnly: true
            ciphertext:
              type: string
              readOnly: true
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
    DeviceAuthTokenRequest:
      type: object
      properties:
        device_identifier:
          type: string
          maxLength: 255
        challenge:
          type: string
          maxLength: 128
      required:
      - device_identifier
      - challenge
    DeviceAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          readOnly: true
        token_type:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
    DeviceLeavesGroup:
      type: object
      properties:
        group:
          type: string
          format: uuid
      required:
      - group
    GetDeviceGroupKeyEnvelopes:
      type: object
      properties:
        groups:
          type: array
          items:
            type: string
            format: uuid
          description: Group UUIDs to fetch wrapped metadata keys for.
        scopes:
          type: array
          items:
            enum:
            - group_shared
            - manager_roster
            type: string
          description: Optional scope filter. Omit to fetch all scopes available to
            the authenticated device. Manager-owned devices may receive both group_shared
            and manager_roster; regular devices receive only group_shared.
      required:
      - groups
    UploadEncryptedImageResponse:
      type: object
      properties:
        image_id:
          type: integer
          readOnly: true
        encrypted_caption:
          type: string
          readOnly: true
          nullable: true
        group:
          type: string
          format: uuid
          readOnly: true
        recipient_count:
          type: integer
          readOnly: true
        ciphertext_hash_sha256:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    NotifyGroup:
      type: object
      properties:
        group:
          type: string
          format: uuid
        encrypted_payload:
          type: string
        nonce:
          type: string
        crypto_version:
          type: integer
          maximum: 32767
          minimum: 1
          default: 1
        encryption_algorithm:
          type: string
          default: xchacha20poly1305
          maxLength: 32
      required:
      - group
      - encrypted_payload
      - nonce
    DeleteEncryptedImage:
      type: object
      properties:
        group:
          type: string
          format: uuid
        image_uuid:
          type: string
          format: uuid
      required:
      - group
      - image_uuid
    DeviceRegistration:
      type: object
      properties:
        device_identifier:
          type: string
          maxLength: 255
        public_key:
          type: string
        public_key_algorithm:
          type: string
          maxLength: 50
        owner_user:
          type: integer
          nullable: true
      required:
      - device_identifier
      - public_key
      - public_key_algorithm
    CreateGroup:
      type: object
      properties:
        encrypted_name:
          type: string
        crypto_version:
          type: integer
          maximum: 32767
          minimum: 1
          default: 1
        encryption_algorithm:
          type: string
          default: xchacha20poly1305
          maxLength: 32
        name_nonce:
          type: string
      required:
      - encrypted_name
      - name_nonce
    CreateGroupKeyEnvelope:
      type: object
      properties:
        group:
          type: string
          format: uuid
        scope:
          enum:
          - group_shared
          - manager_roster
          type: string
          default: group_shared
          description: Key scope for the wrapped group metadata key. Use group_shared
            for metadata any group device may decrypt. Use manager_roster for manager-only
            roster/admin metadata such as encrypted_member_name.
        key_envelopes:
          type: array
          items:
            type: object
            properties:
              recipient_device_identifier:
                type: string
                maxLength: 255
              key_wrap_algorithm:
                type: string
                default: x25519-hkdf-xchacha20poly1305
                maxLength: 32
              recipient_key_fingerprint:
                type: string
                maxLength: 64
              encrypted_group_key:
                type: string
                description: Base64-encoded wrapped shared key material for the selected
                  scope. Use group_shared for metadata all group devices may decrypt,
                  and manager_roster for manager-only roster/admin metadata.
            required:
            - recipient_device_identifier
            - recipient_key_fingerprint
            - encrypted_group_key
      required:
      - group
      - key_envelopes
    CreateGroupKeyEnvelopeResponse:
      type: object
      properties:
        group:
          type: string
          format: uuid
          readOnly: true
        scope:
          enum:
          - group_shared
          - manager_roster
          type: string
          readOnly: true
          description: The key scope that was created or updated.
        envelope_count:
          type: integer
          readOnly: true
        created_count:
          type: integer
          readOnly: true
    AddDeviceToGroup:
      type: object
      properties:
        device_identifier:
          type: string
          maxLength: 255
        group:
          type: string
          format: uuid
        encrypted_member_name:
          type: string
          description: Roster/admin metadata ciphertext for this device in the group.
            Encrypt this with the manager_roster key scope so only manager-owned devices
            can decrypt it.
        is_manager:
          type: boolean
          default: false
          description: Set true to grant manager role in this group to the device
            owner. Requires the device to have a registered user.
      required:
      - device_identifier
      - group
      - encrypted_member_name
    AddDeviceToGroupResponse:
      type: object
      properties:
        device_identifier:
          type: string
          readOnly: true
        group:
          type: string
          format: uuid
          readOnly: true
        encrypted_member_name:
          type: string
          readOnly: true
          nullable: true
          description: Roster/admin metadata ciphertext stored for this device link.
            This value belongs to the manager_roster key scope.
        group_link_created:
          type: boolean
          readOnly: true
    RemoveDeviceFromGroup:
      type: object
      properties:
        device_identifier:
          type: string
          maxLength: 255
        group:
          type: string
          format: uuid
      required:
      - device_identifier
      - group
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - username
      - password
    TokenRefresh:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - refresh
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    UpdateGroup:
      type: object
      properties:
        encrypted_name:
          type: string
        crypto_version:
          type: integer
          maximum: 32767
          minimum: 1
        encryption_algorithm:
          type: string
          maxLength: 32
        name_nonce:
          type: string
        group:
          type: string
          format: uuid
      required:
      - group
