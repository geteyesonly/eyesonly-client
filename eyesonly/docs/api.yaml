openapi: 3.0.2
info:
  title: EyesOnly API
  version: 1.0.0
  description: OpenAPI schema for EyesOnly endpoints.
paths:
  /api/status/:
    get:
      operationId: getStatus
      description: ''
      parameters: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  organization:
                    type: string
      tags:
      - api
  /api/device/groups/:
    get:
      operationId: listGetDeviceGroups
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserGroup'
          description: ''
      tags:
      - api
  /api/device/self/status/:
    get:
      operationId: getDeviceSelfStatus
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeviceSelfStatus'
          description: ''
      tags:
      - api
  /api/device/encrypted-images/:
    get:
      operationId: listEncryptedImages
      description: ''
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Pagination cursor returned by a previous response.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Maximum number of images to return per page.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEncryptedImageListResponse'
          description: Paginated list of encrypted images grouped by group and day.
        '400':
          description: Invalid request parameters.
        '401':
          description: Authentication credentials were not provided.
      tags:
      - api
  /api/device/encrypted-images/{image_uuid}/blob/:
    get:
      operationId: downloadEncryptedImageBlob
      description: ''
      parameters:
      - name: image_uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Binary encrypted image blob
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication credentials were not provided.
        '404':
          description: Encrypted image not found.
      tags:
      - api
  /api/manager/groups/:
    get:
      operationId: getManagerGroups
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      format: uuid
                      readOnly: true
                    encrypted_name:
                      type: string
                      readOnly: true
                    crypto_version:
                      type: integer
                      readOnly: true
                    encryption_algorithm:
                      type: string
                      readOnly: true
                    name_nonce:
                      type: string
                      readOnly: true
                    status:
                      type: string
                      readOnly: true
          description: Groups for the authenticated manager account.
        '401':
          description: Authentication credentials were not provided.
      tags:
      - api
  /api/manager/group-devices/:
    get:
      operationId: getManagerGroupDevices
      description: ''
      parameters:
      - name: group
        in: query
        required: true
        description: UUID of the group whose authenticated user-owned devices should
          be listed.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_identifier:
                      type: string
                      readOnly: true
                    encrypted_member_name:
                      type: string
                      readOnly: true
                      nullable: true
                      description: Roster/admin metadata ciphertext for this device
                        link. This should be encrypted client-side with the manager_roster
                        group metadata key, not the group_shared key.
                    public_key:
                      type: string
                      readOnly: true
                    public_key_algorithm:
                      type: string
                      readOnly: true
                    public_key_fingerprint:
                      type: string
                      readOnly: true
          description: Devices owned by the authenticated user and linked to the specified
            group.
        '401':
          description: Authentication credentials were not provided.
        '404':
          description: Group not found.
      tags:
      - api
  /api/main-manager/groups/:
    get:
      operationId: listGetMainManagerGroups
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MainManagerGroup'
          description: ''
      tags:
      - api
  /api/main-manager/group-devices/:
    get:
      operationId: getMainManagerGroupDevices
      description: ''
      parameters:
      - name: group
        in: query
        required: true
        description: UUID of the group whose devices should be listed.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_identifier:
                      type: string
                      readOnly: true
                    encrypted_member_name:
                      type: string
                      readOnly: true
                      nullable: true
                      description: Roster/admin metadata ciphertext for this device
                        link. This should be encrypted client-side with the manager_roster
                        group metadata key, not the group_shared key.
                    public_key:
                      type: string
                      readOnly: true
                    public_key_algorithm:
                      type: string
                      readOnly: true
                    public_key_fingerprint:
                      type: string
                      readOnly: true
          description: Devices linked to the specified group.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only main managers can perform this action.
        '404':
          description: Group not found.
      tags:
      - api
  /api/device/fcm/:
    post:
      operationId: registerFCMDevice
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterFCMDevice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterFCMDevice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterFCMDevice'
      responses:
        '200':
          description: FCM registration token updated for this device.
        '201':
          description: FCM device registered for this device.
        '400':
          description: Invalid request body.
        '401':
          description: Authentication credentials were not provided.
      tags:
      - api
  /api/device/auth/challenge/:
    post:
      operationId: createCreateDeviceAuthChallenge
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthChallengeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthChallengeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceAuthChallengeRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthChallengeResponse'
          description: ''
      tags:
      - api
  /api/device/auth/token/:
    post:
      operationId: createCreateDeviceAuthToken
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceAuthTokenRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthTokenResponse'
          description: ''
      tags:
      - api
  /api/device/auth/revoke/:
    post:
      operationId: createRevokeDeviceAuthToken
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
          multipart/form-data:
            schema: {}
      responses:
        '204':
          description: Device token revoked successfully.
        '401':
          description: Authentication credentials were not provided.
      tags:
      - api
  /api/device/leave-group/:
    post:
      operationId: deviceLeavesGroup
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLeavesGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceLeavesGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceLeavesGroup'
      responses:
        '204':
          description: Device left the group successfully.
        '401':
          description: Authentication credentials were not provided.
        '404':
          description: Group not found or device is not part of this group.
      tags:
      - api
  /api/device/group-key-envelopes/:
    post:
      operationId: getDeviceGroupKeyEnvelopes
      description: Returns wrapped group metadata keys for the authenticated device.
        Use group_shared for metadata any group device may decrypt. Use manager_roster
        for manager-only roster/admin metadata such as encrypted_member_name. Manager-owned
        devices may receive manager_roster envelopes; regular devices receive only
        group_shared.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDeviceGroupKeyEnvelopes'
            examples:
              all-available-scopes:
                summary: Fetch all scopes available to this device
                value:
                  groups:
                  - 11111111-1111-1111-1111-111111111111
              manager-roster-only:
                summary: Fetch only manager-only roster/admin keys
                value:
                  groups:
                  - 11111111-1111-1111-1111-111111111111
                  scopes:
                  - manager_roster
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetDeviceGroupKeyEnvelopes'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetDeviceGroupKeyEnvelopes'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    group:
                      type: string
                      format: uuid
                      readOnly: true
                    scope:
                      type: string
                      readOnly: true
                      description: 'Scope of the wrapped group metadata key: group_shared
                        or manager_roster.'
                    key_wrap_algorithm:
                      type: string
                      readOnly: true
                    recipient_key_fingerprint:
                      type: string
                      readOnly: true
                    encrypted_group_key:
                      type: string
                      readOnly: true
              examples:
                group-shared-envelope:
                  summary: Shared metadata key visible to all group devices
                  value:
                  - group: 11111111-1111-1111-1111-111111111111
                    scope: group_shared
                    key_wrap_algorithm: x25519-xsalsa20-poly1305
                    recipient_key_fingerprint: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    encrypted_group_key: YmFzZTY0LWdyb3VwLXNoYXJlZC1rZXk=
                manager-roster-envelope:
                  summary: Manager-only roster/admin key
                  value:
                  - group: 11111111-1111-1111-1111-111111111111
                    scope: manager_roster
                    key_wrap_algorithm: x25519-xsalsa20-poly1305
                    recipient_key_fingerprint: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    encrypted_group_key: YmFzZTY0LW1hbmFnZXItcm9zdGVyLWtleQ==
          description: Group key envelopes for the authenticated device.
        '401':
          description: Authentication credentials were not provided.
      tags:
      - api
  /api/manager/upload-encrypted-blob/:
    post:
      operationId: uploadEncryptedImage
      description: ''
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - encrypted_blob
              - group
              - payload_nonce
              - recipient_envelopes
              properties:
                encrypted_blob:
                  type: string
                  format: binary
                  description: Encrypted ciphertext payload file.
                encrypted_caption:
                  type: string
                  description: Optional encrypted caption.
                group:
                  type: string
                  format: uuid
                crypto_version:
                  type: integer
                  minimum: 1
                  maximum: 32767
                  default: 1
                encryption_algorithm:
                  type: string
                  maxLength: 32
                  default: xchacha20poly1305
                payload_nonce:
                  type: string
                  description: Base64-encoded payload nonce.
                recipient_envelopes:
                  type: array
                  items:
                    type: object
                    properties:
                      recipient_device_identifier:
                        type: string
                        maxLength: 255
                      key_wrap_algorithm:
                        type: string
                        default: x25519-hkdf-xchacha20poly1305
                        maxLength: 32
                      recipient_key_fingerprint:
                        type: string
                        maxLength: 64
                      encrypted_content_key:
                        type: string
                    required:
                    - recipient_device_identifier
                    - recipient_key_fingerprint
                    - encrypted_content_key
                  description: Recipient envelope records encoded as JSON in the multipart
                    field.
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                client_ciphertext_hash_sha256:
                  type: string
                  maxLength: 64
                  pattern: ^[a-f0-9]{64}$
            encoding:
              recipient_envelopes:
                contentType: application/json
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadEncryptedImageResponse'
          description: Encrypted image uploaded successfully.
        '400':
          description: Request validation failed.
        '401':
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                required:
                - detail
                properties:
                  detail:
                    type: string
                  quota:
                    type: string
                    nullable: true
                    description: Quota key when the request is rejected by a limit
                      check.
                  current:
                    type: integer
                    nullable: true
                    description: Current usage value for the quota key.
                  maximum:
                    type: integer
                    nullable: true
                    description: Configured maximum value for the quota key.
          description: Permission denied or max_images limit reached.
        '404':
          description: Group not found.
      tags:
      - api
  /api/manager/notify-group/:
    post:
      operationId: notifyGroup
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotifyGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotifyGroup'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  notified_count:
                    type: integer
                  skipped_count:
                    type: integer
          description: FCM notification dispatched to group members.
        '400':
          description: Request validation failed.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only group managers can perform this action.
      tags:
      - api
  /api/delete-encrypted-image/:
    post:
      operationId: deleteEncryptedImagePost
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group:
                  type: string
                  format: uuid
                image_uuid:
                  type: string
                  format: uuid
              required:
              - group
              - image_uuid
        required: true
      responses:
        '204':
          description: Encrypted image deleted successfully.
        '400':
          description: Missing or invalid delete parameters.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only group managers or group devices can perform this action.
        '404':
          description: Group not found or encrypted image not found.
      tags:
      - api
    delete:
      operationId: deleteEncryptedImage
      description: ''
      parameters: []
      responses:
        '204':
          description: Encrypted image deleted successfully.
        '400':
          description: Missing or invalid delete parameters.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only group managers or group devices can perform this action.
        '404':
          description: Group not found or encrypted image not found.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group:
                  type: string
                  format: uuid
                image_uuid:
                  type: string
                  format: uuid
              required:
              - group
              - image_uuid
        required: true
  /api/main-manager/register-device/:
    post:
      operationId: registerDevice
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - device_identifier
                - public_key_algorithm
                - device_created
                properties:
                  device_identifier:
                    type: string
                  public_key_algorithm:
                    type: string
                  device_created:
                    type: boolean
          description: Device already existed and was updated or reused.
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - device_identifier
                - public_key_algorithm
                - device_created
                properties:
                  device_identifier:
                    type: string
                  public_key_algorithm:
                    type: string
                  device_created:
                    type: boolean
          description: Device registered successfully.
        '400':
          description: Request validation failed.
        '401':
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                required:
                - detail
                properties:
                  detail:
                    type: string
                  quota:
                    type: string
                    nullable: true
                    description: Quota key when the request is rejected by a limit
                      check.
                  current:
                    type: integer
                    nullable: true
                    description: Current usage value for the quota key.
                  maximum:
                    type: integer
                    nullable: true
                    description: Configured maximum value for the quota key.
          description: Permission denied or max_devices limit reached.
      tags:
      - api
  /api/main-manager/create-group/:
    post:
      operationId: createGroup
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGroup'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainManagerGroup'
          description: Group created successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                required:
                - detail
                properties:
                  detail:
                    type: string
                  quota:
                    type: string
                    nullable: true
                    description: Quota key when the request is rejected by a limit
                      check.
                  current:
                    type: integer
                    nullable: true
                    description: Current usage value for the quota key.
                  maximum:
                    type: integer
                    nullable: true
                    description: Configured maximum value for the quota key.
          description: Permission denied or max_groups limit reached.
      tags:
      - api
  /api/main-manager/create-group-key-envelope/:
    post:
      operationId: createGroupKeyEnvelope
      description: Creates or updates wrapped group metadata keys for one scope. Use
        group_shared for metadata that any group device may decrypt. Use manager_roster
        for manager-only roster/admin metadata such as encrypted_member_name. manager_roster
        envelopes may only target devices owned by a manager or main manager of the
        group.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupKeyEnvelope'
            examples:
              group-shared:
                summary: Distribute the shared group metadata key to group devices
                value:
                  group: 11111111-1111-1111-1111-111111111111
                  scope: group_shared
                  key_envelopes:
                  - recipient_device_identifier: device-a
                    key_wrap_algorithm: x25519-xsalsa20-poly1305
                    recipient_key_fingerprint: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    encrypted_group_key: YmFzZTY0LWdyb3VwLXNoYXJlZC1rZXk=
              manager-roster:
                summary: Distribute the manager-only roster/admin key
                value:
                  group: 11111111-1111-1111-1111-111111111111
                  scope: manager_roster
                  key_envelopes:
                  - recipient_device_identifier: manager-device-a
                    key_wrap_algorithm: x25519-xsalsa20-poly1305
                    recipient_key_fingerprint: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    encrypted_group_key: YmFzZTY0LW1hbmFnZXItcm9zdGVyLWtleQ==
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateGroupKeyEnvelope'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGroupKeyEnvelope'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupKeyEnvelopeResponse'
          description: Group key envelopes updated successfully.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupKeyEnvelopeResponse'
          description: Group key envelopes created successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only main managers can perform this action.
        '404':
          description: Group not found.
      tags:
      - api
  /api/main-manager/add-device-to-group/:
    post:
      operationId: addDeviceToGroup
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDeviceToGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddDeviceToGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddDeviceToGroup'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDeviceToGroupResponse'
          description: Device was already linked to the group.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDeviceToGroupResponse'
          description: Device linked to the group successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only main managers can perform this action.
        '404':
          description: Group not found or device not found.
      tags:
      - api
  /api/main-manager/remove-device-from-group/:
    post:
      operationId: removeDeviceFromGroup
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveDeviceFromGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RemoveDeviceFromGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RemoveDeviceFromGroup'
      responses:
        '204':
          description: Device removed from the group successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only main managers can perform this action.
        '404':
          description: Group not found, device not found, or device is not part of
            this group.
      tags:
      - api
  /api/token/:
    post:
      operationId: createTokenObtainPair
      description: 'Takes a set of user credentials and returns an access and refresh
        JSON web

        token pair to prove the authentication of those credentials.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
      tags:
      - api
  /api/token/refresh/:
    post:
      operationId: createTokenRefresh
      description: 'Takes a refresh type JSON web token and returns an access type
        JSON web

        token if the refresh token is valid.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
      tags:
      - api
  /api/token/logout/:
    post:
      operationId: createLogout
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
      tags:
      - api
  /api/main-manager/update-group/:
    patch:
      operationId: updateGroup
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateGroup'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainManagerGroup'
          description: Group updated successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only main managers can perform this action.
        '404':
          description: Group not found.
      tags:
      - api
  /api/device/fcm/deregister/:
    delete:
      operationId: deregisterFCMDevice
      description: ''
